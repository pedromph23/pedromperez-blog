name: Build Tailwind CSS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "django>=6.1,<6.2" "django-tailwind[cookiecutter]>=4.5" python-dotenv

      - name: Verify Django settings
        env:
          DJANGO_SECRET_KEY: ci-not-used-but-required-for-check
          DJANGO_DEBUG: 'True'
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          USE_SUPABASE: '0'
        run: |
          echo "=== Python version ==="
          python --version
          echo "=== Django check ==="
          python manage.py check || true
          echo "=== Tailwind settings ==="
          python -c "import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings'); import django; django.setup(); from django.conf import settings; print('TAILWIND_APP_NAME:', getattr(settings,'TAILWIND_APP_NAME', 'NOT SET'))"

      - name: Install Tailwind binary
        env:
          DJANGO_SECRET_KEY: ci-not-used-but-required-for-check
          DJANGO_DEBUG: 'True'
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          USE_SUPABASE: '0'
        run: python manage.py tailwind install

      - name: Build Tailwind CSS
        env:
          DJANGO_SECRET_KEY: ci-not-used-but-required-for-check
          DJANGO_DEBUG: 'True'
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          USE_SUPABASE: '0'
        run: python manage.py tailwind build

      - name: Commit compiled CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f theme/static/css/dist/
          if git diff --cached --quiet; then
            echo "Sin cambios en el CSS compilado"
          else
            git commit -m "chore(css): auto-compilar Tailwind CSS [skip ci]"
            git push
          fi
