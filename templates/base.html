{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Código y Compás{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Blog de Pedro Manuel Pérez Herrera, programador Full Stack venezolano.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  {% tailwind_css %}
</head>
 <!-- GSAP + ScrollTrigger -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="{% static 'js/animations.js' %}"></script>

<body class="font-sans bg-slate-950 text-slate-200 antialiased min-h-dvh">
  <div class="lg:pl-60">
    {% include "partials/sidebar.html" %}
    <main class="mx-auto max-w-3xl px-6 py-10">
      {% if messages %}
        <div class="mb-6 space-y-2">
          {% for message in messages %}
            <div class="rounded-md px-4 py-2 text-sm {{ message.tags }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    {% include "partials/footer.html" %}
  </div>
  <script>
    const btn = document.getElementById('theme-toggle');
    if (btn) {
      btn.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
    }
    try {
      const t = localStorage.getItem('theme');
      document.documentElement.classList.toggle('dark', t !== 'light');
    } catch {}
  </script>
</body>
</html>
